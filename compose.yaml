name: tres-quatro-tres

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: tresquatrotres
      POSTGRES_USER: tresquatrotres
      POSTGRES_PASSWORD: tresquatrotres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tresquatrotres -d tresquatrotres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
